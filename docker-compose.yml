services:
  allure-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Пин версии Allure. Совпадает с дефолтом в Dockerfile; вынесен сюда,
        # чтобы обновление версии было видно в одном месте с остальным
        # развёртыванием.
        ALLURE_VERSION: 3.14.3
    image: allure3-service:0.0.1
    restart: unless-stopped
    environment:
      KEEP_HISTORY: 1
      KEEP_HISTORY_LATEST: 60
      # 0 - вотчер выключен, отчёты собираются только по запросу.
      CHECK_RESULTS_EVERY_SECONDS: 0
    ports:
      # Порт открыт в сеть: до сервиса должны дотягиваться CI-раннеры с
      # других машин. В 0.0.1 сервис никого не аутентифицирует, поэтому
      # разворачивать его следует только в доверенной внутренней сети -
      # кто дотянулся до порта, тот может писать и удалять. Доступ снаружи
      # появится в 0.0.2 вместе со встроенной аутентификацией.
      - "${ALLURE_SERVICE_PORT:-5050}:5050"
    volumes:
      # Весь корень хранилища одним монтированием: публикация отчёта - это
      # переименование каталога из .tmp в reports/latest, а rename не работает
      # через границу файловых систем. Каталог на хосте должен принадлежать
      # UID 1000 - тому, под которым работает сервис:
      #   mkdir -p .data/projects && sudo chown -R 1000:1000 .data/projects
      - ./.data/projects:/app/projects
