name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chrome firefox
          - os: macos-latest
            browsers: chrome safari

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install the Allure CLI
        run: |
          version=$(sed -n 's/^ARG ALLURE_VERSION=//p' docker/Dockerfile)
          test -n "$version"
          npm i -g "allure@$version"

      - name: Assert the report toolchain is present
        run: |
          for bin in node allure; do
            command -v "$bin" || { echo "missing: $bin"; exit 1; }
          done

      - name: Enable Safari automation
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable

      - run: go test -race ./...
        env:
          E2E_BROWSERS: ${{ matrix.browsers }}

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ci:${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start the image
        run: |
          docker run -d --name e2e -p 5050:5050 \
            -e PUBLIC_BASE_URL=http://localhost:5050 \
            -e MAX_CONCURRENT_BUILDS=1 \
            -e CHECK_RESULTS_EVERY_SECONDS=0 \
            ci:${{ github.sha }}
          docker run -d --name e2e-watcher -p 5051:5050 \
            -e PUBLIC_BASE_URL=http://localhost:5051 \
            -e MAX_CONCURRENT_BUILDS=1 \
            -e CHECK_RESULTS_EVERY_SECONDS=1 \
            ci:${{ github.sha }}
          for port in 5050 5051; do
            for _ in $(seq 30); do
              curl -fsS "http://localhost:$port/health" && continue 2
              sleep 1
            done
            exit 1
          done

      - name: End-to-end tests against the image
        env:
          E2E_BASE_URL: http://localhost:5050
          E2E_WATCHER_URL: http://localhost:5051
        run: go test -count=1 -v ./e2e/

      - name: Container logs
        if: always()
        run: |
          docker logs e2e
          docker logs e2e-watcher
