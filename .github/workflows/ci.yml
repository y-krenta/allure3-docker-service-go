name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install the Allure CLI
        run: |
          version=$(sed -n 's/^ARG ALLURE_VERSION=//p' docker/Dockerfile)
          test -n "$version"
          npm i -g "allure@$version"

      - name: Assert the report toolchain is present
        run: |
          for bin in node allure; do
            command -v "$bin" || { echo "missing: $bin"; exit 1; }
          done
          case "$RUNNER_OS" in
            Linux)   command -v google-chrome-stable ;;
            macOS)   test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
          esac || { echo "missing: Chrome"; exit 1; }

      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ci:${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start the image
        run: |
          docker run -d --name e2e -p 5050:5050 \
            -e PUBLIC_BASE_URL=http://localhost:5050 \
            -e MAX_CONCURRENT_BUILDS=1 \
            -e CHECK_RESULTS_EVERY_SECONDS=0 \
            ci:${{ github.sha }}
          for _ in $(seq 30); do
            curl -fsS http://localhost:5050/health && exit 0
            sleep 1
          done
          exit 1

      - name: End-to-end tests against the image
        env:
          E2E_BASE_URL: http://localhost:5050
        run: go test -count=1 -v ./e2e/

      - name: Container log
        if: always()
        run: docker logs e2e
